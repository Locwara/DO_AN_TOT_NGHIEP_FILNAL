{% extends 'base.html' %}
{% block title %}Đổi mật khẩu thành công - DevLearn{% endblock %}

{% block content %}
<div class="flex flex-1 items-center justify-center py-10 px-4">
    <div class="flex flex-col items-center justify-center max-w-[400px] bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-6">
            <span class="material-symbols-outlined text-3xl">check_circle</span>
        </div>
        
        <h1 class="text-2xl font-black text-slate-900 mb-2">Đổi mật khẩu thành công</h1>
        <p class="text-slate-600 text-sm mb-8">Mật khẩu của bạn đã được cập nhật an toàn. Vui lòng sử dụng mật khẩu mới cho những lần đăng nhập tiếp theo.</p>
        
        <a href="{% url 'accounts:profile' %}" class="flex items-center justify-center w-full h-11 bg-primary text-white text-sm font-bold rounded-lg hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20">
            Quay lại Profile
        </a>
    </div>
</div>
{% endblock %}
